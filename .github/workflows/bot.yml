# Startet den Bot automatisch – oder per Knopfdruck in der GitHub-App:
# Actions → Preis-Bot → Run workflow → Aktion auswählen (und ggf. Felder ausfüllen).
name: Preis-Bot

on:
  schedule:
    # Geplant alle 15 Minuten (Uhrzeit in UTC). GitHub startet geplante Läufe
    # zurzeit aber oft nur alle paar Stunden – „Run workflow“ geht jederzeit sofort.
    - cron: "4,19,34,49 * * * *"
  workflow_dispatch:
    inputs:
      aktion:
        description: "Was soll der Bot tun?"
        type: choice
        default: normaler-lauf
        options:
          - normaler-lauf
          - status
          - watchlist
          - set-hinzufuegen
          - set-entfernen
          - max-preis
          - pause
          - weiter
          - test-nachricht
      name:
        description: "Set-Name (für set-hinzufuegen, set-entfernen, max-preis), z. B. Dunkelnacht"
        type: string
        required: false
      suchbegriffe:
        description: "Nur set-hinzufuegen: weitere Namen mit Komma, z. B. Pitch Black, Abyss Eye"
        type: string
        required: false
      produkt:
        description: "Nur max-preis: für welches Produkt des Sets?"
        type: choice
        default: ganzes Set
        options:
          - ganzes Set
          - Display
          - Top-Trainer-Box
          - Booster Bundle
          - Mini-Tin
          - Mini-Tin-Display
          - Kollektion
      preis:
        description: "Nur max-preis: Preis in Euro, z. B. 180 – oder aus"
        type: string
        required: false

# Nie zwei Läufe gleichzeitig (sonst gibt es doppelte Pings)
concurrency:
  group: preis-bot
  cancel-in-progress: false

permissions:
  contents: write  # nötig, damit Steuer-Aktionen die config.yaml speichern können

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Code holen
        uses: actions/checkout@v5
        with:
          fetch-depth: 0  # ganze Geschichte – nötig, um geänderte Einstellungen sicher zu speichern

      - name: Python einrichten
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Pakete installieren
        run: pip install -r requirements.txt

      # Die Datenbank (Preis- und Statusverlauf) wird zwischen den Läufen im
      # GitHub-Cache aufbewahrt – jeder Lauf startet sonst auf einem frischen Server.
      - name: Datenbank vom letzten Lauf holen
        uses: actions/cache/restore@v5
        with:
          path: daten/bot.db
          key: datenbank-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: datenbank-

      - name: Bot starten
        env:
          # Bei automatischen Läufen gibt es keine Auswahl → normaler Lauf
          AKTION: ${{ inputs.aktion || 'normaler-lauf' }}
          NAME: ${{ inputs.name }}
          SUCHBEGRIFFE: ${{ inputs.suchbegriffe }}
          PREIS: ${{ inputs.preis }}
          PRODUKT: ${{ inputs.produkt }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python -m bot "$AKTION" --name "$NAME" --suchbegriffe "$SUCHBEGRIFFE" --preis "$PREIS" --produkt "$PRODUKT"

      - name: Geänderte config.yaml speichern
        env:
          AKTION: ${{ inputs.aktion || 'normaler-lauf' }}
          NAME: ${{ inputs.name }}
        run: |
          if git diff --quiet -- config.yaml; then
            echo "config.yaml unverändert."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add config.yaml
          git commit -m "Steuerung: $AKTION $NAME"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Datenbank für den nächsten Lauf sichern
        if: always() && hashFiles('daten/bot.db') != ''
        uses: actions/cache/save@v5
        with:
          path: daten/bot.db
          key: datenbank-${{ github.run_id }}-${{ github.run_attempt }}
