# Startet den Bot automatisch alle 15 Minuten – oder per Knopfdruck
# (GitHub-App: Actions → Preis-Bot → Run workflow).
name: Preis-Bot

on:
  schedule:
    # Alle 15 Minuten (Uhrzeit in UTC). Absichtlich nicht zur vollen Stunde:
    # Dann hat GitHub besonders viel zu tun und Läufe verspäten sich.
    - cron: "4,19,34,49 * * * *"
  workflow_dispatch:
    inputs:
      aktion:
        description: "Was soll der Bot tun?"
        type: choice
        default: normaler-lauf
        options:
          - normaler-lauf
          - test-nachricht

# Nie zwei Läufe gleichzeitig (sonst gibt es doppelte Pings)
concurrency:
  group: preis-bot
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Code holen
        uses: actions/checkout@v5

      - name: Python einrichten
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Pakete installieren
        run: pip install -r requirements.txt

      # Die Datenbank (Preis- und Statusverlauf) wird zwischen den Läufen im
      # GitHub-Cache aufbewahrt – jeder Lauf startet sonst auf einem frischen Server.
      - name: Datenbank vom letzten Lauf holen
        uses: actions/cache/restore@v5
        with:
          path: daten/bot.db
          key: datenbank-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: datenbank-

      - name: Bot starten
        env:
          # Bei automatischen Läufen gibt es keine Auswahl → normaler Lauf
          AKTION: ${{ inputs.aktion || 'normaler-lauf' }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python -m bot "$AKTION"

      - name: Datenbank für den nächsten Lauf sichern
        if: always() && hashFiles('daten/bot.db') != ''
        uses: actions/cache/save@v5
        with:
          path: daten/bot.db
          key: datenbank-${{ github.run_id }}-${{ github.run_attempt }}
