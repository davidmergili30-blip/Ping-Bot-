# Prüft bei jeder Änderung automatisch, ob noch alles funktioniert.
name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Code holen
        uses: actions/checkout@v5

      - name: Python einrichten
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Pakete installieren
        run: pip install -r requirements.txt

      - name: Tests ausführen
        run: python -m pytest -v
