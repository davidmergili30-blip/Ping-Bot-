# =====================================================================
#  Einstellungen für den Pokémon-TCG Preis- & Restock-Bot
#
#  So liest du diese Datei:
#  - Alles hinter einem # ist ein Kommentar. Den liest der Bot nicht.
#  - Die Einrückung (Leerzeichen am Zeilenanfang) ist wichtig!
#    Bitte nur Leerzeichen benutzen, keine Tabs.
#  - Nach jedem Doppelpunkt kommt ein Leerzeichen:  max_preis: 150
#  - "null" bedeutet: nicht gesetzt / egal
# =====================================================================

allgemein:
  # Bot angehalten? true = pausiert. Am einfachsten über die GitHub-App: Aktion „pause“ / „weiter“
  pausiert: false

  # Zeitzone für Uhrzeiten und Ruhezeiten
  zeitzone: Europe/Berlin

  # Ehrlicher User-Agent: So sieht jeder Shop, wer da anfragt.
  user_agent: "PokemonPreisBot/0.2 (privater Preisalarm, einfaches Skript ohne KI; +https://github.com/davidmergili30-blip/Ping-Bot-)"

  # Pause zwischen zwei Anfragen an denselben Shop in Sekunden (höflich bleiben)
  pause_zwischen_anfragen_sekunden: 5

  # Jeden Shop höchstens alle X Minuten abfragen (mindestens 10)
  min_minuten_pro_shop: 15

  # robots.txt der Shops beachten? Auf deinen Wunsch: false (= ignorieren).
  # Sperren (403, Captcha, Bot-Schutz) werden trotzdem NIE umgangen.
  robots_txt_beachten: false


# ---------------------------------------------------------------------
#  Standard-Regeln für Pings
#  Gelten für alle Produkte. Bei einem Produkt der Watchlist kannst du
#  jede Regel überschreiben (siehe Beispiel unten bei der Watchlist).
# ---------------------------------------------------------------------
standard_regeln:
  # Bei welchen Status soll der Bot dich anpingen?
  # Möglich: BESTELLBAR, VORBESTELLBAR, NUR_EINLADUNG, NUR_MARKTPLATZ,
  #          NUR_FILIALE, BALD, AUSVERKAUFT, UNBEKANNT
  ping_bei_status: [BESTELLBAR, VORBESTELLBAR, NUR_EINLADUNG]

  # Maximalpreis in Euro, z. B. 150. null = egal
  max_preis: null

  # Ping, wenn der Preis um mindestens so viel Prozent fällt, z. B. 10. null = nie
  preissturz_prozent: null

  # Mindest-Marge in Prozent (nach Gebühren und Versand). null = egal  (kommt in Phase 6)
  min_marge_prozent: null

  # Sprache der Produkte: DE, EN, JP oder egal  (kommt in Phase 6)
  sprache: egal

  # Auch Angebote von Marktplatz-Händlern (Drittanbietern) melden?
  marktplatz_angebote: false

  # Nur Shops aus der Vertrauensliste unten melden?
  nur_vertrauenswuerdige_shops: false

  # Ruhezeit, z. B. "22:00-06:00" (mit Anführungszeichen). null = keine  (kommt in Phase 6)
  ruhezeit: null

  # true  = in der Ruhezeit nur dringende Pings (z. B. BESTELLBAR unter Maximalpreis)
  # false = in der Ruhezeit gar keine Pings
  in_ruhezeit_nur_dringend: true


# ---------------------------------------------------------------------
#  Vertrauenswürdige Shops (Schutz vor Fake-Shops)
#  Pings von Shops, die hier NICHT stehen, bekommen eine ⚠️ Warnung.
# ---------------------------------------------------------------------
vertrauenswuerdige_shops:
  - gate-to-the-games.de
  - card-corner.de
  - games-island.eu
  - mediamarkt.de
  - saturn.de
  - mueller.de
  - smythstoys.com


# ---------------------------------------------------------------------
#  Watchlist: was der Bot genau beobachten soll
#
#  Variante A – ganze Sets per Suchbegriff (empfohlen):
#    Der Bot sucht in allen unterstützten Shops nach den Begriffen und beobachtet
#    JEDES passende Produkt (Displays, Trainer-Boxen, Bundles, Kollektionen – siehe
#    kategorie_filter unten). Tipp: deutschen, englischen und japanischen Namen eintragen.
#      - name: "Dunkelnacht"
#        suche:
#          - Dunkelnacht
#          - Pitch Black
#
#  Variante B – einzelne Produkte per Link:
#      - name: "So soll es im Ping heißen"
#        links:
#          - https://link-zum-produkt
#        max_preis: 180          # optional: eigene Regel nur für dieses Produkt
#
#  Unterstützte Shops: gate-to-the-games.de, card-corner.de
#  (games-island.eu verbietet automatisches Abfragen – dafür gibt es ihren Discord)
# ---------------------------------------------------------------------
watchlist:
  - name: "30 Jahre"
    suche:
      - 30 Jahre
      - 30th Celebration

  - name: "Dunkelnacht"
    suche:
      - Dunkelnacht
      - Pitch Black
      - Abyss Eye          # japanisch (sehr wahrscheinlich dasselbe Set)

  - name: "Erhabene Helden"
    suche:
      - Erhabene Helden
      - Ascended Heroes

  - name: "Wachsendes Chaos"
    suche:
      - Wachsendes Chaos
      - Chaos Rising
      - Ninja Spinner      # japanisch (sehr wahrscheinlich dasselbe Set)

  - name: "Fatale Flammen"
    suche:
      - Fatale Flammen
      - Phantasmal Flames
      - Inferno X          # japanisch

  - name: "Optimale Ordnung"
    suche:
      - Optimale Ordnung
      - Perfect Order
      - Nihil Zero         # japanisch


# ---------------------------------------------------------------------
#  Kategorien: Shop-Seiten, auf denen der Bot nach NEUEN Produkten und
#  VORBESTELLUNGEN sucht – auch für Produkte, die nicht auf der Watchlist stehen.
#  Beim ersten Mal kommt eine Übersicht, danach nur noch Neuigkeiten.
# ---------------------------------------------------------------------
kategorien:
  - name: "Gate to the Games – Pokémon Vorverkauf"
    link: https://www.gate-to-the-games.de/Pokemon-Karten/Pokemon-Sammelkarten/

  - name: "Card-Corner – Neu eingetroffen"
    link: https://www.card-corner.de/Neu-Eingetroffen

  # Games Island: Der Bot liest deren offizielle Datenliste für Programme
  # (crawlme.games-island.eu). Die zeigt keine Preise – im Ping steht dann „Preis im Shop“.
  - name: "Games Island – Booster Displays & Bundles"
    link: https://games-island.eu/c/Pokemon/Booster-Displays

  - name: "Games Island – Top-Trainer-Boxen"
    link: https://games-island.eu/c/Pokemon/Elite-Trainer-Box

  - name: "Games Island – Boxen & Kollektionen"
    link: https://games-island.eu/c/Pokemon/Boxen-Sets


# ---------------------------------------------------------------------
#  Deal-Feeds: Hier posten Leute Angebote, sobald sie irgendwo auftauchen –
#  auch bei Shops, die der Bot selbst nicht abfragen kann (Amazon, Netto,
#  MediaMarkt, Kaufland …). Es gilt derselbe Filter wie unten.
#  Liegt ein Deal über dem Maximalpreis seines Sets, kommt kein Ping.
# ---------------------------------------------------------------------
feeds:
  - name: "mydealz – Pokémon"
    link: https://www.mydealz.de/rss/gruppe/pokemon


# ---------------------------------------------------------------------
#  Filter: Welche Produkte interessieren dich?
#  Gilt für die Kategorien UND für die Set-Suche der Watchlist
#  (nicht für Produkte, die du per Link einträgst).
# ---------------------------------------------------------------------
kategorie_filter:
  # Nur Produkte, deren Name mindestens eins dieser Wörter enthält (leer = alle)
  nur_mit:
    - Display
    - Top-Trainer
    - Top Trainer
    - Elite Trainer
    - Elite-Trainer
    - ETB
    - Booster Bundle
    - Booster-Bundle
    - Kollektion
    - Collection

  # Produkte mit diesen Wörtern im Namen werden ignoriert
  ohne:
    - Chinesisch
    - CN
    - Koreanisch
    - KR
    - Mystery
    - Einzelkarte
    - Einzelkarten
    - Illustration Rare
    - Blister
    - B-Ware
    - Sleeves
